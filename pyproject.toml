[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-mlir-native-support"
version = "0.1.0"
description = "Atlas out-of-tree binding for Merlin native compilation"
requires-python = ">=3.11"
dependencies = ["merlin[semantic-search] @ https://github.com/ucb-bar/merlin/archive/5706178219c5eb888bb61c22ad847d6b479b8e70.zip"]

[project.optional-dependencies]
test = ["pytest", "numpy", "safetensors"]

[project.entry-points."merlin.native_target_compilers"]
atlas = "atlas_mlir_native.binding:AtlasNativeBinding"

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
