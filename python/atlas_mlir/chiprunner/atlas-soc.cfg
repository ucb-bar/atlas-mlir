# Atlas test chip (chipyard EE290TapeoutConfig) on its SODIMM card. JTAG goes
# through the carrier board's own FT2232H (USB-C -> FTDI -> SODIMM -> SoC),
# which has no EEPROM, so it enumerates as "Dual RS232-HS".
#
# Uses the pre-0.11 command names so riscv-openocd 0.10.0+dev also reads it.

### Adapter configuration ###
interface                   ftdi
adapter_khz                 2000
# ACBUS1 resets the whole chip, like the board's reset button, so OpenOCD's
# "reset", "reset halt" and "reset run" work. The pin is open drain: driven low
# to reset, left floating (pulled high) otherwise.
reset_config                srst_only srst_open_drain
adapter_nsrst_assert_width  100
adapter_nsrst_delay         100

### FTDI interface configuration ###
ftdi_vid_pid                0x0403 0x6010
ftdi device_desc "Dual RS232-HS"
ftdi_channel                0
# ADBUS0-3 = TCK, TDI, TDO, TMS (standard MPSSE JTAG).
# ACBUS0 drives Atlas's active-high jtag_reset (chipyard's WithDebugIOCells,
# externalReset = true). The pin idles high, which holds the TAP in reset and
# makes TDO read all zeros, so drive it low. ACBUS1 is the chip reset (see
# reset_config above). Leave the other ACBUS pins as inputs until we know what
# the board wires to them.
ftdi_layout_init            0x0000 0x010B
ftdi_layout_signal nSRST    -data 0x0200 -oe 0x0200
ftdi_tdo_sample_edge        rising

transport select            jtag


### Set the target chip name and expected TAP ID ###
set _CHIPNAME riscv
# rocket-chip's default IDCODE, read from the chip
set _CPUTAPID 0x00000001


### Add TAPs to the Scan Chain ###
jtag newtap $_CHIPNAME cpu -irlen 5 -expected-id $_CPUTAPID


### Add CPU targets ###
# One hart: the Shuttle core. The Atlas accelerator is added with a
# SubsystemInjector, not as a RISC-V tile.
set _TARGETNAME_0 $_CHIPNAME.cpu0

target create $_TARGETNAME_0 riscv -chain-position $_CHIPNAME.cpu -coreid 0

### Configure work area ###
# Disabled: running OpenOCD's verify_image algorithm from a work area at
# 0x0800F000 left the hart unable to halt, and only a power cycle recovered it.
# Without a work area, OpenOCD reads memory back over JTAG instead.
# atlas.ld keeps the top 4 KiB of the scratchpad free in case this comes back.
#set _WORKAREASIZE 0x1000
#$_TARGETNAME_0 configure -work-area-phys 0x0800F000 -work-area-size $_WORKAREASIZE -work-area-backup 0

### Chip reset procedure ###
# No halt here: GDB halts the core when it attaches.
init

echo "Ready for Remote Connections"
