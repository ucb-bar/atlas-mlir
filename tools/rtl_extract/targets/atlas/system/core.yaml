# AtlasCore with the instruction entering at the scalar decoder: every engine, memory, the MREG bank tracker and the
# scalar frontend assertions run as RTL; fetch, PC, register file and ALU are replaced by inputs. The frontend never
# stalls except on DELAY and DMA.WAIT (not issued here), so s1_fire is driven directly; the ALU result carries the
# VLS word address (VMEM line << 3). Host TileLink ports, CSR writes and DMA stay idle.
engine: core
module: AtlasCore
description: >
  One instruction per command age through the RTL decoder into AtlasCore; engine ports observed through probes.
  Instruction words follow lib/AtlasEncoding.cpp (vd[12:7], vs1[18:13], vs2[24:19]; VLS store flag bit 13).
limit: 200
unreset:                      # Reg without init, read only under a RegInit valid; at system level the request bank
                              # selects the MREG/VMEM response route, so these enter the control cone
  - {path: lsu, name: vloadVmemBase}
  - {path: lsu, name: vstoreMregId}
  - {path: lsu, name: vstoreVmemBase}
  - {path: mxu0/seq, name: inflight_0_accSel}
  - {path: mxu0/seq, name: inflight_0_rowsWritten}
  - {path: mxu0/seq, name: inflight_1_accSel}
  - {path: mxu0/seq, name: inflight_1_rowsWritten}
  - {path: mxu0/seq, name: inflight_2_accSel}
  - {path: mxu0/seq, name: inflight_2_rowsWritten}
  - {path: mxu0/seq, name: p0Cmd_mregId}
  - {path: mxu0/seq, name: p0Cmd_op}
  - {path: mxu0/seq, name: p0Row}
  - {path: mxu0/seq, name: p1Cmd_mregId}
  - {path: mxu0/seq, name: p1Cmd_op}
  - {path: mxu0/seq, name: p1Row}
  - {path: mxu1/seq, name: inflight_0_accSel}
  - {path: mxu1/seq, name: inflight_0_rowsWritten}
  - {path: mxu1/seq, name: inflight_1_accSel}
  - {path: mxu1/seq, name: inflight_1_rowsWritten}
  - {path: mxu1/seq, name: p0Cmd_accSel}
  - {path: mxu1/seq, name: p0Cmd_mregId}
  - {path: mxu1/seq, name: p0Cmd_op}
  - {path: mxu1/seq, name: p0Cmd_weightSlot}
  - {path: mxu1/seq, name: p0Row}
  - {path: mxu1/seq, name: p1Cmd_accSel}
  - {path: mxu1/seq, name: p1Cmd_mregId}
  - {path: mxu1/seq, name: p1Cmd_op}
  - {path: mxu1/seq, name: p1Cmd_weightSlot}
  - {path: mxu1/seq, name: p1Row}
  - {path: xlu, name: activeCmd_srcMregId}
inputs:
  instruction: 0x00000013     # addi x0, x0, 0
  fire: 0
  address: 0
  host_start: 0
  dma_size: 0
  dma_vmem_addr: 0
  dma_dram_addr: 0
  dma_vmem_read: 0
  dma_vmem_read_bank: 0
  dma_vmem_read_line: 0
  dma_vmem_write: 0
  dma_vmem_write_bank: 0
  dma_vmem_write_line: 0
  io_imemTL_a_valid: 0
  io_imemTL_a_bits_opcode: 0
  io_imemTL_a_bits_param: 0
  io_imemTL_a_bits_size: 0
  io_imemTL_a_bits_source: 0
  io_imemTL_a_bits_address: 0
  io_imemTL_a_bits_mask: 0
  io_imemTL_a_bits_data: 0
  io_imemTL_a_bits_corrupt: 0
  io_imemTL_d_ready: 0
  io_csrTL_a_valid: 0
  io_csrTL_a_bits_opcode: 0
  io_csrTL_a_bits_param: 0
  io_csrTL_a_bits_size: 0
  io_csrTL_a_bits_source: 0
  io_csrTL_a_bits_address: 0
  io_csrTL_a_bits_mask: 0
  io_csrTL_a_bits_data: 0
  io_csrTL_a_bits_corrupt: 0
  io_csrTL_d_ready: 0
  io_dmaTL_a_ready: 0
  io_dmaTL_d_valid: 0
  io_dmaTL_d_bits_opcode: 0
  io_dmaTL_d_bits_param: 0
  io_dmaTL_d_bits_size: 0
  io_dmaTL_d_bits_source: 0
  io_dmaTL_d_bits_sink: 0
  io_dmaTL_d_bits_denied: 0
  io_dmaTL_d_bits_data: 0
  io_dmaTL_d_bits_corrupt: 0
  io_vmemTL_a_valid: 0
  io_vmemTL_a_bits_opcode: 0
  io_vmemTL_a_bits_param: 0
  io_vmemTL_a_bits_size: 0
  io_vmemTL_a_bits_source: 0
  io_vmemTL_a_bits_address: 0
  io_vmemTL_a_bits_mask: 0
  io_vmemTL_a_bits_data: 0
  io_vmemTL_a_bits_corrupt: 0
  io_vmemTL_d_ready: 0
cuts:
  instruction: {path: scalar, value: s1_instr}
  fire: {path: scalar, value: s1_fire}
  address: {instance: scalar/alu, result: io_out}
  host_start: {path: scalar, value: hostStart}                      # CSR run/halt machinery follows the PC
  dma_size: {instance: scalar, result: io_dmaCmd_bits_size}         # DMA operands come from the register file
  dma_vmem_addr: {instance: scalar, result: io_dmaCmd_bits_vmemAddr}
  dma_dram_addr: {instance: scalar, result: io_dmaCmd_bits_addr}
  dma_vmem_read: {instance: dma, result: io_vmemRead_valid}         # idle DMA: no VMEM requests
  dma_vmem_read_bank: {instance: dma, result: io_vmemRead_bits_bankIdx}
  dma_vmem_read_line: {instance: dma, result: io_vmemRead_bits_bankAddr}
  dma_vmem_write: {instance: dma, result: io_vmemWrite_valid}
  dma_vmem_write_bank: {instance: dma, result: io_vmemWrite_bits_bankIdx}
  dma_vmem_write_line: {instance: dma, result: io_vmemWrite_bits_bankAddr}
probes:
  lsu_busy: {instance: lsu, result: io_vecBusy}
  vpu_busy: {instance: vpu, result: io_busy}
  xlu_busy: {instance: xlu, result: io_busy}
  lsu_vmem_read: {instance: lsu, result: io_vmemVecRead_valid}
  lsu_vmem_read_bank: {instance: lsu, result: io_vmemVecRead_bits_bankIdx}
  lsu_vmem_read_row: {instance: lsu, result: io_vmemVecRead_bits_bankAddr}
  lsu_vmem_write: {instance: lsu, result: io_vmemVecWrite_valid}
  lsu_vmem_write_bank: {instance: lsu, result: io_vmemVecWrite_bits_bankIdx}
  lsu_vmem_write_row: {instance: lsu, result: io_vmemVecWrite_bits_bankAddr}
  lsu_mreg_read: {instance: lsu, result: io_mregReadReq_valid}
  lsu_mreg_read_id: {instance: lsu, result: io_mregReadReq_bits_mregId}
  lsu_mreg_read_row: {instance: lsu, result: io_mregReadReq_bits_row}
  lsu_mreg_write: {instance: lsu, result: io_mregWriteReq_valid}
  lsu_mreg_write_id: {instance: lsu, result: io_mregWriteReq_bits_mregId}
  lsu_mreg_write_row: {instance: lsu, result: io_mregWriteReq_bits_row}
  vpu_read0: {instance: vpu, result: io_mregReadReq0_valid}
  vpu_read0_id: {instance: vpu, result: io_mregReadReq0_bits_mregId}
  vpu_read0_row: {instance: vpu, result: io_mregReadReq0_bits_row}
  vpu_read1: {instance: vpu, result: io_mregReadReq1_valid}
  vpu_read1_id: {instance: vpu, result: io_mregReadReq1_bits_mregId}
  vpu_read1_row: {instance: vpu, result: io_mregReadReq1_bits_row}
  vpu_write0: {instance: vpu, result: io_mregWriteReq0_valid}
  vpu_write0_id: {instance: vpu, result: io_mregWriteReq0_bits_mregId}
  vpu_write0_row: {instance: vpu, result: io_mregWriteReq0_bits_row}
  vpu_write1: {instance: vpu, result: io_mregWriteReq1_valid}
  vpu_write1_id: {instance: vpu, result: io_mregWriteReq1_bits_mregId}
  vpu_write1_row: {instance: vpu, result: io_mregWriteReq1_bits_row}
  xlu_read: {instance: xlu, result: io_mregReadReq_valid}
  xlu_read_id: {instance: xlu, result: io_mregReadReq_bits_mregId}
  xlu_read_row: {instance: xlu, result: io_mregReadReq_bits_row}
  xlu_write: {instance: xlu, result: io_mregWriteReq_valid}
  xlu_write_id: {instance: xlu, result: io_mregWriteReq_bits_mregId}
  xlu_write_row: {instance: xlu, result: io_mregWriteReq_bits_row}
busy: [lsu_busy, vpu_busy, xlu_busy]
events:
  vmem_read: {valid: lsu_vmem_read, fields: {bankIdx: lsu_vmem_read_bank, bankAddr: lsu_vmem_read_row}, row: bankAddr}
  vmem_write: {valid: lsu_vmem_write, fields: {bankIdx: lsu_vmem_write_bank, bankAddr: lsu_vmem_write_row}, row: bankAddr}
  mreg_read: {valid: lsu_mreg_read, fields: {mregId: lsu_mreg_read_id, row: lsu_mreg_read_row}, row: row}
  mreg_write: {valid: lsu_mreg_write, fields: {mregId: lsu_mreg_write_id, row: lsu_mreg_write_row}, row: row}
  vpu_read0: {valid: vpu_read0, fields: {mregId: vpu_read0_id, row: vpu_read0_row}, row: row, split_by: mregId}
  vpu_read1: {valid: vpu_read1, fields: {mregId: vpu_read1_id, row: vpu_read1_row}, row: row, split_by: mregId}
  vpu_write0: {valid: vpu_write0, fields: {mregId: vpu_write0_id, row: vpu_write0_row}, row: row, split_by: mregId}
  vpu_write1: {valid: vpu_write1, fields: {mregId: vpu_write1_id, row: vpu_write1_row}, row: row, split_by: mregId}
  xlu_read: {valid: xlu_read, fields: {mregId: xlu_read_id, row: xlu_read_row}, row: row}
  xlu_write: {valid: xlu_write, fields: {mregId: xlu_write_id, row: xlu_write_row}, row: row}
operations:                   # VLS address = VMEM line << 3; banks hold 8192 lines
  vload:                      # m5 <- bank 1, line 0
    commands: {0: {fire: 1, instruction: 0x00000287, address: 65536}}
  vload_bank2:                # m42 <- bank 2, line 1024
    commands: {0: {fire: 1, instruction: 0x00001507, address: 139264}}
  vload_bank5:                # m42 <- bank 5, line 64
    commands: {0: {fire: 1, instruction: 0x00001507, address: 328192}}
  vstore:                     # m9 -> bank 2, line 0
    commands: {0: {fire: 1, instruction: 0x00002487, address: 131072}}
  vstore_bank1:               # m17 -> bank 1, line 1024
    commands: {0: {fire: 1, instruction: 0x00002887, address: 73728}}
  vstore_bank3:               # m17 -> bank 3, line 32
    commands: {0: {fire: 1, instruction: 0x00002887, address: 196864}}
  vstore_m5:                  # m5 -> bank 3, line 32
    commands: {0: {fire: 1, instruction: 0x00002287, address: 196864}}
  vstore_m34:                 # m34 (physical MREG bank 2) -> bank 2, line 0
    commands: {0: {fire: 1, instruction: 0x00003107, address: 131072}}
  transpose:                  # m3 -> m7
    commands: {0: {fire: 1, instruction: 0x000063eb}}
  add:                        # m10:11 <- m2:3 + m6:7
    commands: {0: {fire: 1, instruction: 0x00304557}}
  exp:                        # m10:11 <- exp m2:3
    commands: {0: {fire: 1, instruction: 0x84304557}}
  rmax:                       # m10, m11 <- rowmax m2:3
    commands: {0: {fire: 1, instruction: 0x4c304557}}
  rsum:
    commands: {0: {fire: 1, instruction: 0x42304557}}
  csum:
    commands: {0: {fire: 1, instruction: 0x02304557}}
  fp8unpack:                  # m10:11 <- unpack m6, scale register 2
    commands: {0: {fire: 1, instruction: 0x8a304557}}
  vli_all:                    # m10:11 <- immediate
    commands: {0: {fire: 1, instruction: 0x0000055f}}
  add_hi:                     # m26:27 <- m18:19 + m22:23
    commands: {0: {fire: 1, instruction: 0x00b24d57}}
  exp_hi:
    commands: {0: {fire: 1, instruction: 0x84b24d57}}
  exp2_hi:
    commands: {0: {fire: 1, instruction: 0x86b24d57}}
  relu_hi:
    commands: {0: {fire: 1, instruction: 0x90b24d57}}
invariants: {}                # every assertion in AtlasCore
