  instruction: 0x00000013     # addi x0, x0, 0
  fire: 0
  address: 0
  host_start: 0
  dma_size: 0
  dma_vmem_addr: 0
  dma_dram_addr: 0
  dma_vmem_read: 0
  dma_vmem_read_bank: 0
  dma_vmem_read_line: 0
  dma_vmem_write: 0
