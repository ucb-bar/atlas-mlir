operations:                   # VLS/DMA VMEM address = VMEM line << 3; banks hold 8192 lines; a tile is 32 lines
  dma_load0:                  # ch0: DRAM 0x90000000 -> bank 3, lines 0..31
    commands: {0: {fire: 1, instruction: 0x0020837b, dma_vmem_addr: 196608, dma_dram_addr: 0x90000000, dma_size: 1024}}
  dma_load1:                  # ch1: DRAM 0x90001000 -> bank 4, lines 0..31
    commands: {0: {fire: 1, instruction: 0x0020937b, dma_vmem_addr: 262144, dma_dram_addr: 0x90001000, dma_size: 1024}}
  dma_load1_bank3:            # ch1: DRAM 0x90001000 -> bank 3, lines 64..95
    commands: {0: {fire: 1, instruction: 0x0020937b, dma_vmem_addr: 197120, dma_dram_addr: 0x90001000, dma_size: 1024}}
  dma_store0:                 # ch0: bank 3, lines 0..31 -> DRAM 0x90002000
    commands: {0: {fire: 1, instruction: 0x022401fb, dma_vmem_addr: 196608, dma_dram_addr: 0x90002000, dma_size: 1024}}
  dma_store1:                 # ch1: bank 4, lines 0..31 -> DRAM 0x90003000
    commands: {0: {fire: 1, instruction: 0x022411fb, dma_vmem_addr: 262144, dma_dram_addr: 0x90003000, dma_size: 1024}}
  dma_store1_bank3:           # ch1: bank 3, lines 64..95 -> DRAM 0x90003000
    commands: {0: {fire: 1, instruction: 0x022411fb, dma_vmem_addr: 197120, dma_dram_addr: 0x90003000, dma_size: 1024}}
  vload:                      # m5 <- bank 1, line 0
    commands: {0: {fire: 1, instruction: 0x00000287, address: 65536}}
  vload_bank3:                # m42 <- bank 3, line 1024
    commands: {0: {fire: 1, instruction: 0x00001507, address: 204800}}
  vstore:                     # m9 -> bank 2, line 0
    commands: {0: {fire: 1, instruction: 0x00002487, address: 131072}}
  vstore_bank3:               # m17 -> bank 3, line 32 (adjacent to the DMA tile)
    commands: {0: {fire: 1, instruction: 0x00002887, address: 196864}}
  vstore_bank3_tile:          # m17 -> bank 3, line 0 (the DMA tile itself)
    commands: {0: {fire: 1, instruction: 0x00002887, address: 196608}}
  transpose:                  # m3 -> m7
    commands: {0: {fire: 1, instruction: 0x000063eb}}
  add:                        # m10:11 <- m2:3 + m6:7
    commands: {0: {fire: 1, instruction: 0x00304557}}
  mxu0_matmul:                # m12, acc 0, slot 0 (MXU words as in core.yaml)
    commands: {0: {fire: 1, instruction: 0x14018077}}
  mxu0_matmul_acc:            # m12, acc 0, slot 0
    commands: {0: {fire: 1, instruction: 0x18018077}}
  mxu0_push_weight:           # m12 -> slot 0
    commands: {0: {fire: 1, instruction: 0x00018077}}
  mxu0_push_acc_fp8:          # m12 -> acc 0
    commands: {0: {fire: 1, instruction: 0x04018077}}
  mxu0_push_acc_bf16:         # m12:13 -> acc 0
    commands: {0: {fire: 1, instruction: 0x08018077}}
  mxu0_pop_acc_fp8:           # acc 0 -> m20, scale register 0
    commands: {0: {fire: 1, instruction: 0x0c000a77}}
  mxu0_pop_acc_bf16:          # acc 0 -> m20:21
    commands: {0: {fire: 1, instruction: 0x10000a77}}
  mxu1_matmul:
    commands: {0: {fire: 1, instruction: 0x16018077}}
  mxu1_matmul_acc:
    commands: {0: {fire: 1, instruction: 0x1a018077}}
  mxu1_push_weight:
    commands: {0: {fire: 1, instruction: 0x02018077}}
  mxu1_push_acc_fp8:
    commands: {0: {fire: 1, instruction: 0x06018077}}
  mxu1_push_acc_bf16:
    commands: {0: {fire: 1, instruction: 0x0a018077}}
  mxu1_pop_acc_fp8:
    commands: {0: {fire: 1, instruction: 0x0e000a77}}
  mxu1_pop_acc_bf16:
    commands: {0: {fire: 1, instruction: 0x12000a77}}
invariants: {}                # every assertion in AtlasCore
