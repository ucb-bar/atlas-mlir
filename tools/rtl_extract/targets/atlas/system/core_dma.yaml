# AtlasCore as in core.yaml, with the DMA engine live: its VMEM requests reach the VMEM arbiter and its TileLink
# port is served by a declared responder (external memory answers every beat `latency` ages after it is accepted,
# in order; request acceptance follows `accept`). DMA operands come from the register-file cuts at launch; the
# transfer's VMEM accesses are recorded only when the arbiter grants them. Channel busy (the level DMA.WAIT polls,
# engine busy or the launch register) is part of `busy`, so a run drains only when every launched transfer has retired.
# Both MXUs are observed as in core.yaml (pairs/core_dma_mxu.yaml); with them idle, pairs/core_dma.yaml is unchanged.
engine: core_dma
module: AtlasCore
description: >
  One instruction per command age through the RTL decoder into AtlasCore with a live DMA engine; the external
  memory is a declared responder. DMA words follow lib/AtlasEncoding.cpp (load rd=x6 rs1=x1 rs2=x2, store rd=x3
  rs1=x8 rs2=x2, channel in [14:12]); VLS and MXU words as in core.yaml.
limit: 450
unreset:                      # core.yaml's list plus the DMA command slots and per-source metadata, written at
                              # enqueue/A-fire and read only under slotActive or a response for that source
  - {path: lsu, name: vloadVmemBase}
  - {path: lsu, name: vstoreMregId}
  - {path: lsu, name: vstoreVmemBase}
  - {path: mxu0/seq, name: inflight_0_accSel}
  - {path: mxu0/seq, name: inflight_0_rowsWritten}
  - {path: mxu0/seq, name: inflight_1_accSel}
  - {path: mxu0/seq, name: inflight_1_rowsWritten}
  - {path: mxu0/seq, name: inflight_2_accSel}
  - {path: mxu0/seq, name: inflight_2_rowsWritten}
  - {path: mxu0/seq, name: p0Cmd_mregId}
  - {path: mxu0/seq, name: p0Cmd_op}
  - {path: mxu0/seq, name: p0Row}
  - {path: mxu0/seq, name: p1Cmd_mregId}
  - {path: mxu0/seq, name: p1Cmd_op}
  - {path: mxu0/seq, name: p1Row}
  - {path: mxu0/seq, name: w0Cmd_op}
  - {path: mxu0/seq, name: w0Row}
  - {path: mxu0/seq, name: w1Row}
  - {path: mxu1/seq, name: inflight_0_accSel}
  - {path: mxu1/seq, name: inflight_0_rowsWritten}
  - {path: mxu1/seq, name: inflight_1_accSel}
  - {path: mxu1/seq, name: inflight_1_rowsWritten}
  - {path: mxu1/seq, name: p0Cmd_accSel}
  - {path: mxu1/seq, name: p0Cmd_mregId}
  - {path: mxu1/seq, name: p0Cmd_op}
  - {path: mxu1/seq, name: p0Cmd_weightSlot}
  - {path: mxu1/seq, name: p0Row}
  - {path: mxu1/seq, name: p1Cmd_accSel}
  - {path: mxu1/seq, name: p1Cmd_mregId}
  - {path: mxu1/seq, name: p1Cmd_op}
  - {path: mxu1/seq, name: p1Cmd_weightSlot}
  - {path: mxu1/seq, name: p1Row}
  - {path: mxu1/seq, name: w0Cmd_op}
  - {path: mxu1/seq, name: w0Row}
  - {path: mxu1/seq, name: w1Row}
  - {path: xlu, name: activeCmd_srcMregId}
  - {path: dma, match: 'commandQueue_[0-7]_(opType|channelId|vmemLineAddr|transferSize)'}
  - {path: dma, match: 'sourceMeta_[0-9]+_(isLoad|slotIdx|lineAddr)'}
inputs:
  instruction: 0x00000013     # addi x0, x0, 0
  fire: 0
  address: 0
  host_start: 0
  dma_size: 0
  dma_vmem_addr: 0
  dma_dram_addr: 0
  io_imemTL_a_valid: 0
  io_imemTL_a_bits_opcode: 0
  io_imemTL_a_bits_param: 0
  io_imemTL_a_bits_size: 0
  io_imemTL_a_bits_source: 0
  io_imemTL_a_bits_address: 0
  io_imemTL_a_bits_mask: 0
  io_imemTL_a_bits_data: 0
  io_imemTL_a_bits_corrupt: 0
  io_imemTL_d_ready: 0
  io_csrTL_a_valid: 0
  io_csrTL_a_bits_opcode: 0
  io_csrTL_a_bits_param: 0
  io_csrTL_a_bits_size: 0
  io_csrTL_a_bits_source: 0
  io_csrTL_a_bits_address: 0
  io_csrTL_a_bits_mask: 0
  io_csrTL_a_bits_data: 0
  io_csrTL_a_bits_corrupt: 0
  io_csrTL_d_ready: 0
  io_dmaTL_a_ready: 0
  io_dmaTL_d_valid: 0
  io_dmaTL_d_bits_opcode: 0
  io_dmaTL_d_bits_param: 0
  io_dmaTL_d_bits_size: 0
  io_dmaTL_d_bits_source: 0
  io_dmaTL_d_bits_sink: 0
  io_dmaTL_d_bits_denied: 0
  io_dmaTL_d_bits_data: 0
  io_dmaTL_d_bits_corrupt: 0
  io_vmemTL_a_valid: 0
  io_vmemTL_a_bits_opcode: 0
  io_vmemTL_a_bits_param: 0
  io_vmemTL_a_bits_size: 0
  io_vmemTL_a_bits_source: 0
  io_vmemTL_a_bits_address: 0
  io_vmemTL_a_bits_mask: 0
  io_vmemTL_a_bits_data: 0
  io_vmemTL_a_bits_corrupt: 0
  io_vmemTL_d_ready: 0
cuts:
  instruction: {path: scalar, value: s1_instr}
  fire: {path: scalar, value: s1_fire}
  address: {instance: scalar/alu, result: io_out}
  host_start: {path: scalar, value: hostStart}
  dma_size: {instance: scalar, result: io_dmaCmd_bits_size}         # DMA operands come from the register file
  dma_vmem_addr: {instance: scalar, result: io_dmaCmd_bits_vmemAddr}
  dma_dram_addr: {instance: scalar, result: io_dmaCmd_bits_addr}
responders:
  dram:                       # external memory answering after the testbench's 43 cycles; requests always accepted,
                              # so a transfer's timing does not depend on the age it launches at (pair sweeps shift
                              # the second operation); the testbench's request stalls are covered on Verilator
    request: {valid: io_dmaTL_a_valid, ready: io_dmaTL_a_ready, tag: io_dmaTL_a_bits_source,
              fields: {address: io_dmaTL_a_bits_address, opcode: io_dmaTL_a_bits_opcode}}
    response: {valid: io_dmaTL_d_valid, ready: io_dmaTL_d_ready, tag: io_dmaTL_d_bits_source}
    latency: 43
    accept: [1]
