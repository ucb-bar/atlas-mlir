# MXU0 against MXU1 on AtlasCore (targets/atlas/system/core.yaml): every ordered pair of commands across the two units
# (MXU0 operands m12/m12:13 and m20/m20:21, MXU1 operands m14/m14:15 and m22/m22:23; accumulator and weight slot 0
# on each unit), plus a pop feeding the other unit's matmul (RAW), a pop onto the other unit's matmul source (WAR)
# and two matmuls reading one physical MREG bank. Every AtlasCore assertion is an invariant.
engine: core
description: Command on one MXU and a command on the other g ages later through the RTL decoder; all AtlasCore assertions checked.
equivalent:                   # the VPU overlap path may serve the second command on the other port pair
  vpu_read: [vpu_read0, vpu_read1]
  vpu_write: [vpu_write0, vpu_write1]
shared:                       # control the two operations may share in the cone check
  - {input: instruction, reason: one instruction per age through the decoder; commands never share an age}
  - {input: fire, reason: issue strobe of that instruction}
  - {input: address, reason: VLS address operand of that instruction}
  - {path: mreg, reason: MREG file; per-bank port conflicts are MregFile invariants}
  - {path: vmem, reason: VMEM banks; same-bank conflicts are Vmem invariants}
pairs:
  mxu0_push_weight_mxu1_push_weight:
    first: mxu0_push_weight
    second: mxu1_push_weight_m14
    gaps: 1..110
