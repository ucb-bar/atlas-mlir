# MXU commands against VPU, VLS and XLU commands on AtlasCore (targets/atlas/system/core.yaml), extending
# core_mxu.yaml to every MXU command, every VPU timing class and to operands that share a register (RAW, WAR and WAW
# through the MREG bank tracker) or a physical MREG bank (register mod 32: MregFile per-bank ports). Unless the pair
# name says otherwise, operands are disjoint as in core_mxu.yaml. Every AtlasCore assertion is an invariant.
engine: core
description: MXU command and a VPU, VLS or XLU command g ages apart through the RTL decoder; all AtlasCore assertions checked.
equivalent:                   # the VPU overlap path may serve the second command on the other port pair
  vpu_read: [vpu_read0, vpu_read1]
  vpu_write: [vpu_write0, vpu_write1]
shared:                       # control the two operations may share in the cone check
  - {input: instruction, reason: one instruction per age through the decoder; commands never share an age}
  - {input: fire, reason: issue strobe of that instruction}
  - {input: address, reason: VLS address operand of that instruction}
  - {path: mreg, reason: MREG file; per-bank port conflicts are MregFile invariants}
  - {path: vmem, reason: VMEM banks; same-bank conflicts are Vmem invariants}
