# MXU against a pending DMA transfer on AtlasCore (targets/atlas/system/core_dma.yaml): every MXU command on both
# units, issued g ages after a DMA load or store on channel 0 (and a DMA launch g ages after the MXU command), with
# every AtlasCore assertion checked. MXU operands (m12/m12:13 sources, m20/m20:21 pop destinations, accumulator and
# weight slot 0) share no MREG bank with anything the DMA touches; the DMA moves bank 3 lines 0..31. A gap is
# accepted only when the MXU's events and the transfer's beats and handshakes all keep their isolated ages.
engine: core_dma
description: MXU command g ages after a DMA launch, and a DMA launch g ages after an MXU command; all AtlasCore assertions checked.
shared:                       # control the two operations may share in the cone check
  - {input: instruction, reason: one instruction per age through the decoder; commands never share an age}
  - {input: fire, reason: issue strobe of that instruction}
  - {input: dma_size, reason: "DMA size operand of that instruction, captured at launch"}
  - {input: dma_vmem_addr, reason: "DMA VMEM operand of that instruction, captured at launch"}
  - {input: dma_dram_addr, reason: "DMA DRAM operand of that instruction, captured at launch"}
  - {path: mreg, reason: MREG file; per-bank port conflicts are MregFile invariants}
  - {path: vmem, reason: VMEM arbiter; DMA grants are the dma_vmem events}
pairs:
  load0_mxu0_matmul:
    first: dma_load0
    second: mxu0_matmul
    gaps: 1..140
  mxu0_matmul_load0:
    first: mxu0_matmul
    second: dma_load0
    gaps: 1..100
  store0_mxu0_matmul:
