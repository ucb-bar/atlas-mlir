# DMA concurrency on AtlasCore (targets/atlas/system/core_dma.yaml): a second DMA launch on another channel, or
# vector/engine work, issued g ages after a DMA launch, with every AtlasCore assertion checked. The DMA's events are
# its granted VMEM accesses and its external-memory handshakes (dram.request/dram.response), so a gap is accepted
# only when the transfer's beats and the other operation's events all keep their isolated ages; a rejected gap with
# "dram.request"/"dma_vmem_*" events missing means the transfer was queued or its VMEM access denied (delayed), while
# test/test_rtl_extract_dma.py checks that every beat still happens exactly once. The RTL has no DMA address
# assertion: `load0_vstore_bank3_tile` writes the DMA's own lines and is accepted, so address disjointness is a
# compiler rule.
engine: core_dma
description: Second operation issued g ages after a DMA launch (or a DMA launch after an engine command); all AtlasCore assertions checked.
shared:                       # control the two operations may share in the cone check
  - {input: instruction, reason: one instruction per age through the decoder; commands never share an age}
  - {input: fire, reason: issue strobe of that instruction}
  - {input: address, reason: VLS address operand of that instruction}
  - {input: dma_size, reason: "DMA size operand of that instruction, captured at launch"}
  - {input: dma_vmem_addr, reason: "DMA VMEM operand of that instruction, captured at launch"}
  - {input: dma_dram_addr, reason: "DMA DRAM operand of that instruction, captured at launch"}
  - {path: mreg, reason: MREG file; per-bank port conflicts are MregFile invariants}
  - {path: vmem, reason: VMEM arbiter; the LSU is granted unconditionally and DMA grants are the dma_vmem events}
pairs:
  load0_load1:                # ch0 bank 3, then ch1 bank 4
    first: dma_load0
    second: dma_load1
    gaps: 1..140
  load0_load1_bank3:          # ch0 bank 3 lines 0..31, then ch1 bank 3 lines 64..95
    first: dma_load0
    second: dma_load1_bank3
    gaps: 1..140
  store0_store1:              # ch0 bank 3, then ch1 bank 4
    first: dma_store0
    second: dma_store1
    gaps: 1..140
  load0_store1:
    first: dma_load0
    second: dma_store1
    gaps: 1..140
  store0_load1:
    first: dma_store0
    second: dma_load1
    gaps: 1..140
  load0_vload:                # DMA writes bank 3; VLOAD reads bank 1
    first: dma_load0
    second: vload
    gaps: 1..140
  load0_vstore:               # DMA writes bank 3; VSTORE writes bank 2
    first: dma_load0
    second: vstore
    gaps: 1..140
  store0_vload:               # DMA reads bank 3; VLOAD reads bank 1
    first: dma_store0
    second: vload
    gaps: 1..140
  store0_vstore:              # DMA reads bank 3; VSTORE writes bank 2
    first: dma_store0
    second: vstore
    gaps: 1..140
  load0_vload_bank3:          # same bank, lines 0..31 / 1024..1055: the LSU is granted first, DMA writes wait
    first: dma_load0
    second: vload_bank3
    gaps: 1..140
  load0_vstore_bank3:         # same bank, lines 0..31 / 32..63
    first: dma_load0
    second: vstore_bank3
    gaps: 1..140
  store0_vload_bank3:         # same bank; DMA reads wait for the VLOAD's reads
    first: dma_store0
    second: vload_bank3
    gaps: 1..140
  store0_vstore_bank3:
    first: dma_store0
    second: vstore_bank3
    gaps: 1..140
  load0_vstore_bank3_tile:    # VSTORE onto the DMA's own lines: no RTL assertion; a data hazard the compiler must order
    first: dma_load0
    second: vstore_bank3_tile
    gaps: 1..140
  vload_load0:                # VLOAD bank 1, then a DMA load into bank 3
    first: vload
    second: dma_load0
    gaps: 1..40
  vstore_load0:
    first: vstore
    second: dma_load0
    gaps: 1..40
  vload_store0:
    first: vload
    second: dma_store0
    gaps: 1..40
  vload_bank3_load0:          # VLOAD bank 3 lines 1024.., then a DMA load into bank 3 lines 0..31
    first: vload_bank3
    second: dma_load0
    gaps: 1..40
  vload_bank3_store0:         # VLOAD bank 3, then a DMA store reading bank 3: the DMA's first reads wait
    first: vload_bank3
    second: dma_store0
    gaps: 1..40
  load0_add:
    first: dma_load0
    second: add
    gaps: 1..140
  add_load0:
    first: add
    second: dma_load0
    gaps: 1..70
  load0_transpose:
    first: dma_load0
    second: transpose
    gaps: 1..140
  transpose_store0:
    first: transpose
    second: dma_store0
    gaps: 1..70
# Regression values used only by tests (full sweep in build/rtl-extract/out/pairs-core_dma.json); the extractor never
# reads them. A null stable_gap means no swept gap kept both transfers' isolated timing: a second DMA launch is
# queued behind the first (its requests, and a store's VMEM reads, start after the first's last request). Same-bank
# VLS rejections are the DMA's accesses waiting for the LSU; the VLS events never move (test_rtl_extract_dma.py).
expect:
  load0_load1: {min_gap: null, stable_gap: null, rejected_by: missing dram.request events}
  load0_load1_bank3: {min_gap: null, stable_gap: null, rejected_by: missing dram.request events}
  store0_store1: {min_gap: null, stable_gap: null, rejected_by: missing dma_vmem_read events}
  load0_store1: {min_gap: null, stable_gap: null, rejected_by: missing dma_vmem_read events}
  store0_load1: {min_gap: null, stable_gap: null, rejected_by: missing dram.request events}
  load0_vload: {min_gap: 1, stable_gap: 1, disjoint: true}
  load0_vstore: {min_gap: 1, stable_gap: 1, disjoint: true}
  store0_vload: {min_gap: 1, stable_gap: 1, disjoint: true}
  store0_vstore: {min_gap: 1, stable_gap: 1, disjoint: true}
  load0_vload_bank3: {min_gap: 1, stable_gap: 75, rejected_by: missing dma_vmem_write events, disjoint: true}
  load0_vstore_bank3: {min_gap: 1, stable_gap: 73, rejected_by: missing dma_vmem_write events, disjoint: true}
  store0_vload_bank3: {min_gap: 32, stable_gap: 32, rejected_by: missing dma_vmem_read events, disjoint: true}
  store0_vstore_bank3: {min_gap: 30, stable_gap: 30, rejected_by: missing dma_vmem_read events, disjoint: true}
  load0_vstore_bank3_tile: {min_gap: 1, stable_gap: 73, rejected_by: missing dma_vmem_write events, disjoint: true}
  vload_load0: {min_gap: 1, stable_gap: 1, disjoint: true}
  vstore_load0: {min_gap: 1, stable_gap: 1, disjoint: true}
  vload_store0: {min_gap: 1, stable_gap: 1, disjoint: true}
  vload_bank3_load0: {min_gap: 1, stable_gap: 1, disjoint: true}
  vload_bank3_store0: {min_gap: 32, stable_gap: 32, rejected_by: missing dma_vmem_read events, disjoint: true}
  load0_add: {min_gap: 1, stable_gap: 1, disjoint: true}
  add_load0: {min_gap: 1, stable_gap: 1, disjoint: true}
  load0_transpose: {min_gap: 1, stable_gap: 1, disjoint: true}
  transpose_store0: {min_gap: 1, stable_gap: 1, disjoint: true}
