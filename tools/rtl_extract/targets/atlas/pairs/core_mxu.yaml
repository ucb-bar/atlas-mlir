# System-level MXU pairs on AtlasCore (targets/atlas/system/core.yaml): the MXU command goes through the RTL decoder
# and scalar frontend, so every AtlasCore assertion (MXU sequencer issue checks, MREG bank tracker, MregFile per-bank
# ports) is an invariant and no guards are declared. MXU operands: source m12 (second m14), pop destination m20:21,
# physical banks disjoint from the VPU, VLS and XLU operands of core.yaml unless the pair name says otherwise.
engine: core
description: Second instruction issued g ages after the first through the RTL decoder; MXU commands against each other and against VPU, VLS and XLU commands; all AtlasCore assertions checked.
equivalent:                   # the VPU overlap path may serve the second command on the other port pair
  vpu_read: [vpu_read0, vpu_read1]
  vpu_write: [vpu_write0, vpu_write1]
shared:                       # control the two operations may share in the cone check
  - {input: instruction, reason: one instruction per age through the decoder; commands never share an age}
  - {input: fire, reason: issue strobe of that instruction}
  - {input: address, reason: VLS address operand of that instruction}
  - {path: mreg, reason: MREG file; per-bank port conflicts are MregFile invariants}
  - {path: vmem, reason: VMEM banks; same-bank conflicts are Vmem invariants}
pairs:
  mxu0_matmul_matmul_same_acc: 
    first: mxu0_matmul
    second: mxu0_matmul_m14
    gaps: 1..70
  mxu0_matmul_matmul_same_acc_other_slot: 
    first: mxu0_matmul
    second: mxu0_matmul_m14_slot1
    gaps: 1..70
  mxu0_matmul_matmul_other_acc: 
    first: mxu0_matmul
    second: mxu0_matmul_m14_acc1
    gaps: 1..70
  mxu0_matmul_matmul_other_acc_other_slot: 
