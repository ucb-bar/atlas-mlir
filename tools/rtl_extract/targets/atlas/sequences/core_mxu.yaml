      - {op: mxu0_matmul, as: mxu0.matmul, inputs: {instruction: 0x14010077}}
      - {op: mxu0_matmul, as: mxu0.matmul, inputs: {instruction: 0x140180f7}}
      - {op: mxu0_matmul, as: mxu0.matmul, inputs: {instruction: 0x14020077}}
    lengths: 2..5
    gaps: 1..100
