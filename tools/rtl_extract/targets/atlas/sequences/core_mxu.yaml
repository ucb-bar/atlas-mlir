      - {op: mxu0_matmul, as: mxu0.matmul, inputs: {instruction: 0x14088077}}
      - {op: mxu0_matmul, as: mxu0.matmul, inputs: {instruction: 0x14010077}}
      - {op: mxu0_matmul, as: mxu0.matmul, inputs: {instruction: 0x14098077}}
    lengths: 2..4
    gaps: 1..100
  mxu0_matmul_other_acc_same_slot:
